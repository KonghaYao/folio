services:
  folio:
    build: .
    restart: unless-stopped
    ports:
      - "${FOLIO_BIND:-127.0.0.1}:${FOLIO_PORT:-3000}:3000"
    volumes:
      - folio-data:/data
    environment:
      FOLIO_AI_ALLOWED_ORIGINS: "${FOLIO_AI_ALLOWED_ORIGINS:-}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
    healthcheck:
      test: ["CMD", "bun", "-e", "if (!(await fetch('http://localhost:3000/api/health')).ok) process.exit(1)"]
      interval: 20s
      timeout: 4s
      retries: 3
volumes:
  folio-data:
